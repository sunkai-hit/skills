name: Finalize Web Presentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web-presentation.yaml'
      - 'prototype/**'
      - '.project/**'
      - 'tools/web-presentation/**'
      - '.github/workflows/finalize-web-presentation.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow pyyaml
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          else
            echo 'Chrome/Chromium is required for QA rendering.' >&2
            exit 1
          fi

      - name: Finalize release
        run: python tools/web-presentation/finalize_release.py web-presentation.yaml

      - name: Verify package
        run: |
          test -s web-presentation.yaml
          find release -type f -name '*Standalone.html' -size +1k | grep .
          find qa -type f -name 'contact-sheet-*.jpg' -size +1k | grep .
          find release -type f -name 'SHA256SUMS.txt' -size +1c | grep .

      - name: Commit generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release/ qa/ prototype/ .project/ web-presentation.yaml
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'release: finalize Web Presentation artifacts'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
